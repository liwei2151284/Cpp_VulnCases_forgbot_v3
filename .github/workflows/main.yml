
name: "Frogbot Scan Repository"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main

permissions:
  pull-requests: write
  contents: write
  security-events: write
  id-token: write

jobs:
  scan-repository:
    runs-on: ubuntu-latest
    name: Scan Repository (${{ matrix.branch }} branch)

    strategy:
      matrix:
        branch: ["main"]

    steps:
      # 1. 下载代码到 GitHub Runner 本地目录
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      # 2. Frogbot V3 扫描本地代码
      - uses: jfrog/frogbot@v3
        env:
          JF_URL: "https://solenglatest.jfrog.io"
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JF_GIT_BASE_BRANCH: ${{ matrix.branch }}

          # 关键：使用本地已下载的 Git 仓库
          JF_USE_LOCAL_REPOSITORY: "true"

          # 调试日志
          JFROG_CLI_LOG_LEVEL: "DEBUG"

        with:
          oidc-provider-name: liwei-github-oidc
          oidc-audience: jfrog-github
