name: "Frogbot Scan Repository"
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  pull-requests: write
  contents: write
  security-events: write
  # [Mandatory if using OIDC authentication protocol instead of JF_ACCESS_TOKEN]
  # id-token: write

jobs:
  scan-repository:
    runs-on: ubuntu-latest
    name: Scan Repository (${{ matrix.branch }} branch)
    strategy:
      matrix:
        branch: [ "main" ]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - uses: jfrog/frogbot@v3
       # with:
       #   version: 3.4.2
        env:
          JF_URL: "https://solenglatest.jfrog.io"
        with:
          oidc-provider-name: liwei-github-oidc 
          oidc-audience: jfrog-github
